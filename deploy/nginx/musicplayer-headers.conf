# /etc/nginx/snippets/musicplayer-headers.conf
#
# Included in every location of the site: a location that adds a header of its
# own drops every add_header it would have inherited. music.example.com stands
# for the site's domain, as in listen-together.conf.
#
# The policy names each outside origin the page uses and nothing more:
#   www.youtube.com      the IFrame API script, and the player's frame
#   i.ytimg.com          song artwork
#   cdn.discordapp.com   avatars
# data: fonts because the bundler inlines the two small font files into the CSS.
# blob: media for the silent loop the page plays so that media keys reach it.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com; img-src 'self' https://i.ytimg.com https://cdn.discordapp.com; style-src 'self'; font-src 'self' data:; media-src blob:; connect-src 'self' wss://music.example.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# YouTube refuses to play (error 153) for an embed that sends no referrer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
