# /etc/nginx/sites-available/listen-together.conf, linked from sites-enabled
#
# music.example.com stands for the site's domain, APP_URL's host: the copy on
# the server names the real one, which stays out of the repository.
#
# nginx serves the prebuilt pages and assets from /var/www/music.example.com
# itself (its workers cannot read /root). Only /api and the room socket reach
# Bun, on the PORT set in /root/musicplayer/.env.
#
# Plain HTTP on purpose: `certbot --nginx -d music.example.com` adds the
# certificate, the 443 listener and the redirect from HTTP.

upstream musicplayer {
    server 127.0.0.1:3040;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    root /var/www/music.example.com;
    # The build writes a .gz beside every text file; nginx sends it as is.
    gzip_static on;
    gzip_vary on;
    # The API takes small JSON bodies only.
    client_max_body_size 16k;

    # The pages: revalidated on every visit, so a deploy reaches everyone at once.
    location = / {
        include snippets/musicplayer-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /room.html =404;
    }

    location = /login {
        include snippets/musicplayer-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /login.html =404;
    }

    location = /admin {
        include snippets/musicplayer-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /admin.html =404;
    }

    # Named by their content: a changed file gets a new name, so a year is safe.
    location /assets/ {
        include snippets/musicplayer-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /api/room/socket {
        include snippets/musicplayer-headers.conf;
        proxy_pass http://musicplayer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Browsers ping once a minute; a socket silent for three is gone.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        include snippets/musicplayer-headers.conf;
        proxy_pass http://musicplayer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        include snippets/musicplayer-headers.conf;
        return 404;
    }
}
